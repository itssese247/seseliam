  document.documentElement.dataset.theme = dark?"dark":"light";
  document.documentElement.dataset.read = localStorage.getItem("sese_read")||"m";
}catch(e){}})();
</script>

:root{
  --paper:#ffffff; --sky:#eef6fc; --sky-2:#dcecf8; --sky-3:#c6e0f2;
  --line:#b7d7ee; --edge:#8ab8db; --ink:#2d4457; --soft:#7d9ab1; --shadow:#cfe4f4;
  --deep:#173d63;
  --serif-sc:"Times New Roman","SeseRare","Noto Serif SC","Songti SC","STSong","宋体",SimSun,"Source Han Serif SC",serif;
  --serif:"Times New Roman","SeseRare","Noto Serif TC","Noto Serif SC","Songti TC","Songti SC","STSong","宋體","宋体",SimSun,"新細明體",PMingLiU,MingLiU,"Source Han Serif TC",serif;
}
*{box-sizing:border-box;font-family:inherit}
html{scroll-behavior:auto;font-family:var(--serif)}
body{margin:0;background:var(--sky);color:var(--ink);overflow-x:hidden;
  font-family:var(--serif);font-size:17px;line-height:1.95;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,textarea,select{font-family:var(--serif);font-size:1rem;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--edge);outline-offset:2px}

/* 只有真的有滑鼠的裝置才套 hover；觸控裝置若套用，第一次點會被當成移入而沒反應 */
@media (hover:hover) and (pointer:fine){
  .px-btn:hover{background:var(--sky-2)}
  .icon-btn:hover{background:var(--sky-2)}
  .post-card:hover{box-shadow:2px 2px 0 var(--shadow);transform:translate(3px,3px)}
  .cacts button:hover{color:var(--ink)}
  :root[data-theme="dark"] .post-card:hover{background:#1a2c44}
  .tag-bar button:hover{background:var(--sky-2)}
  .toc li span:hover{color:var(--edge)}
}
/* 觸控：取消 300ms 延遲與點擊灰塊 */
button,select,input,textarea,[data-go],[data-tag],[data-lang],[data-theme-btn],.post-card,.toc li span,summary{
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.post-card:active{box-shadow:2px 2px 0 var(--shadow);transform:translate(3px,3px)}

.px-box{background:var(--paper);border:2px solid var(--edge);box-shadow:5px 5px 0 var(--shadow)}
.px-rule{height:6px;background-image:repeating-linear-gradient(90deg,var(--edge) 0 6px,transparent 6px 12px)}
.px-btn{background:var(--paper);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadow);padding:6px 14px;border-radius:0;
  display:inline-flex;align-items:center;gap:7px}
.ic{width:1.05em;height:1.05em;flex:none;stroke-width:2.1}
.ic.fill{fill:var(--edge);stroke:none}

.px-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.px-btn.is-on{background:var(--sky-3)}
.px-btn.slim{padding:3px 10px;font-size:.82rem;box-shadow:2px 2px 0 var(--shadow)}
input[type=text],input[type=password],input[type=url],textarea,select{
  background:var(--paper);border:2px solid var(--line);border-radius:0;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--edge);outline:none}

.topbar{position:sticky;top:0;z-index:40;background:rgba(238,246,252,.94);backdrop-filter:blur(4px);border-bottom:2px solid var(--line)}
.topbar-in{max-width:1060px;margin:0 auto;padding:10px 24px;display:flex;gap:12px;align-items:center}
.brand-mini{font-size:1.1rem;font-weight:bold;letter-spacing:.06em;white-space:nowrap}
.search-wrap{flex:1;display:flex;gap:8px;align-items:center}
.search-wrap input{padding:6px 10px}
.icon-btn{background:var(--paper);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadow);
  padding:5px 9px;display:flex;align-items:center}

.icon-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.icon-btn svg{width:17px;height:17px;stroke-width:2}

.hero{max-width:1060px;margin:0 auto;padding:44px 24px 26px;text-align:center}
.hero h1{font-size:clamp(2.1rem,6vw,3.1rem);line-height:1;margin:0;letter-spacing:.03em;font-weight:bold}
.hero .sub{font-style:italic;font-size:.72rem;color:var(--soft);letter-spacing:.1em;margin-top:11px}
.hero .px-rule{margin:22px auto 0;max-width:180px}

.art{fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.art .sol{fill:var(--edge);stroke:none}
.art .acc{stroke-width:1.5}
.lang-pick{display:flex;justify-content:center;gap:8px;margin-top:18px}
.lang-pick .px-btn{padding:4px 14px;font-size:.85rem}
footer .lang-pick{margin-bottom:18px}
.hero-art{display:flex;justify-content:center;align-items:flex-end;gap:30px;margin-top:20px}
.hero-art svg{width:50px;height:50px}
.corner-art{position:absolute;right:20px;top:18px;width:58px;height:58px}
.sec-head svg{width:28px;height:28px;align-self:center}
.divider-art{display:flex;align-items:center;gap:16px;margin:46px auto;max-width:760px}
.divider-art .px-rule{flex:1}
.divider-art svg{width:56px;height:40px;flex:none}
.empty svg{width:64px;height:64px;margin:0 auto 12px}
footer svg{width:46px;height:32px;margin:0 auto 8px}

main{max-width:1060px;margin:0 auto;padding:0 24px 140px}
.card{padding:32px 36px;margin-bottom:44px;position:relative}
.card h2{font-size:1.5rem;margin:0 0 4px;letter-spacing:.08em}
.notice ol{padding-left:1.4em;margin:18px 0 0}
.notice li{margin-bottom:14px}
.notice a{color:#3d7ba6}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 18px}
.sec-head h2{font-size:1.25rem;margin:0;letter-spacing:.1em}
.sec-head span{font-size:.8rem;color:var(--soft);font-style:italic}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.post-card{cursor:pointer;background:var(--paper);border:2px solid var(--edge);box-shadow:5px 5px 0 var(--shadow)}

.post-card .cover{aspect-ratio:16/9;overflow:hidden;border-bottom:2px solid var(--edge);background:var(--sky-2)}
.post-card .cover img{width:100%;height:100%;object-fit:cover}
.post-card .meta{padding:14px 16px 18px}
.post-card .t{font-size:1.12rem;font-weight:bold;line-height:1.5}
.post-card .s{font-size:.82rem;color:var(--soft);margin-top:6px;line-height:1.6}
.empty{padding:40px;text-align:center;color:var(--soft);font-style:italic}
[data-go]{cursor:pointer}

.post-cover{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);height:340px;
  border-bottom:2px solid var(--edge);overflow:hidden;background:var(--sky-2);margin-bottom:40px}
.post-cover img{width:100%;height:100%;object-fit:cover}
.post-head{text-align:center;margin-bottom:8px}
.post-head h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:bold;margin:0 0 10px;line-height:1.4}
.post-head .slogan{font-weight:bold;font-size:.95rem;color:var(--soft);margin:0}
.post-tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 30px}
.post-nav{max-width:760px;margin:36px auto 0;display:flex;justify-content:space-between;gap:12px}

/* 內文與編輯器共用樣式 */
.simp,body.simp{font-family:var(--serif-sc)}
.rich{max-width:760px;margin:0 auto;text-align:left;overflow-wrap:break-word}
.rich p{margin:0 0 1.2em;min-height:1em}
.rich h2{font-size:1.2rem;letter-spacing:.06em;margin:1.8em 0 .7em;padding-left:12px;border-left:6px solid var(--sky-3)}
.rich blockquote{margin:1.5em 0;padding:2px 0 2px 18px;border-left:4px solid var(--edge);color:var(--soft);font-style:italic}
.rich .callout{margin:1.5em 0;padding:14px 18px;background:var(--sky);border:2px solid var(--line)}
.rich .white{margin:1.5em 0;padding:14px 18px;background:var(--paper);border:2px solid var(--edge);color:var(--deep)}
.rich .callout p:last-child,.rich .white p:last-child,.rich blockquote p:last-child{margin-bottom:0}
.rich ul,.rich ol{padding-left:1.5em;margin:0 0 1.2em}

.comments{max-width:760px;margin:56px auto 0}
.comments h3{font-size:1.05rem;letter-spacing:.1em;margin:0 0 4px}
.cmt-form{margin:18px 0 26px;display:grid;gap:10px}
.cmt-form .row input{max-width:240px}
.name-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name-pick select{width:auto;min-width:112px;padding:6px 8px}
.name-pick span{font-size:.9rem;color:var(--soft)}
.cmt-warn{border:2px solid #d8a3a3;background:#fdf4f4;padding:10px 12px;font-size:.86rem;color:#8a4b4b;display:none}
.cmt-warn.on{display:block}
.cmt{display:flex;gap:12px;border-top:2px dotted var(--line);padding:16px 2px}

const store = {
  mode:null,   // cloud / local / none：啟動時決定一次，之後不再混用
  async init(){
    if(window.storage){
      try{
        await window.storage.set("__probe__","1",false);
        const r=await window.storage.get("__probe__",false);
        if(r&&r.value==="1"){ this.mode="cloud"; return; }

    catch(e){ this.mode="none"; }
  },
  async get(k){
    if(this.mode==="cloud"){ try{ const r=await window.storage.get(k,false); return r? r.value : null; }catch(e){ return null; } }
    if(this.mode==="local"){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
    return null;
  },
  async set(k,v){
    if(this.mode==="cloud"){ try{ await window.storage.set(k,v,false); return true; }catch(e){ return false; } }
    if(this.mode==="local"){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
    return false;
  }
};

function toSimplified(s){
  let o="",i=0;
  while(i<s.length){
    let hit=null;
    for(let L=Math.min(T2S_PHRASE.max,s.length-i);L>1;L--){
      const seg=s.substr(i,L);
      if(T2S_PHRASE.m[seg]){ hit=[seg,T2S_PHRASE.m[seg]]; break; }
    }
    if(hit){ o+=hit[1]; i+=hit[0].length; } else { o+=(T2S[s[i]]||s[i]); i++; }
  }
  return o;
}
function toSimpleChars(s){ let o=""; for(const c of s) o+=(T2S[c]||c); return o; }

/* 內文淨化：保留段落、換行、粗斜體與四種區塊 */
const KEEP_INLINE=["b","strong","i","em","u","a","br","span"];
const KEEP_BLOCK=["p","h2","blockquote","ul","ol","li","div"];
function sanitizeRich(html){
  const d=document.createElement("div"); d.innerHTML=html||"";
  (function walk(n){
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===8){ c.remove(); return; }
      if(c.nodeType!==1) return;
      let tag=c.tagName.toLowerCase();
      if(["script","style","meta","link","iframe","object"].includes(tag)){ c.remove(); return; }
      if(["h1","h3","h4","h5","h6"].includes(tag)){ const e=document.createElement("h2"); e.innerHTML=c.innerHTML; c.replaceWith(e); walk(e); return; }
      if(tag==="div"){
        const cls=c.className||"";
        if(/\b(callout|white)\b/.test(cls)){
          const keep=/\bcallout\b/.test(cls)?"callout":"white";
          [...c.attributes].forEach(a=>c.removeAttribute(a.name));
          c.className=keep; walk(c); return;
        }
        const p=document.createElement("p"); p.innerHTML=c.innerHTML; c.replaceWith(p); walk(p); return;
      }
      if(!KEEP_INLINE.includes(tag)&&!KEEP_BLOCK.includes(tag)){
        const f=document.createDocumentFragment(); while(c.firstChild) f.appendChild(c.firstChild); c.replaceWith(f); return;
      }
      [...c.attributes].forEach(a=>{ if(!(tag==="a"&&a.name==="href")) c.removeAttribute(a.name); });
      if(tag==="a"){ c.setAttribute("target","_blank"); c.setAttribute("rel","noopener"); }
      walk(c);
    });
  })(d);
  return d.innerHTML;
}
function plainText(p){
  const body = p.html || (p.blocks||[]).map(b=>b.html).join(" ");
  return [p.title,p.slogan,body].join(" ").replace(/<[^>]+>/g," ");
}

/* 留言用字檢查 */
function normalizeForCheck(s){ return toSimpleChars(String(s).toLowerCase().replace(/[^\u4e00-\u9fffa-z0-9]/g,"")); }
const BLOCK_N = BLOCK_WORDS.map(normalizeForCheck).filter(Boolean);
const ALLOW_N = ALLOW_WORDS.map(normalizeForCheck).filter(Boolean);
function checkComment(text){
  const n=normalizeForCheck(text);
  if(!n) return {ok:false,why:"留言看起來是空的，寫點什麼再送出吧。"};
  if(/(.)\1{29,}/.test(text)) return {ok:false,why:"同一個字重複太多次囉，換個寫法再送出。"};
  let masked=n; ALLOW_N.forEach(a=>{ masked=masked.split(a).join(""); });
  for(const w of BLOCK_N) if(masked.includes(w))
    return {ok:false,why:"留言裡有不太友善的字，換個說法再送出好嗎？這裡想留給大家舒服的空間。"};
  return {ok:true};
}

/* 全站繁簡：畫面渲染完後直接換文字節點；原文記在 ORIG 裡，切回繁體時還原 */
const ORIG=new WeakMap();
function textNodes(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(n){ return (n.parentElement&&n.parentElement.closest(".no-simp"))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  return list;
}
function simplifyTree(root){
  if(!root) return;
  textNodes(root).forEach(n=>{
    if(!ORIG.has(n)) ORIG.set(n,n.nodeValue);
    const t=toSimplified(ORIG.get(n));
    if(t!==n.nodeValue) n.nodeValue=t;
  });
  root.querySelectorAll("[placeholder]").forEach(el=>{
    if(el.closest(".no-simp")) return;
    if(el.dataset.ph===undefined) el.dataset.ph=el.placeholder;
    el.placeholder=toSimplified(el.dataset.ph);
  });
  root.querySelectorAll("[title]").forEach(el=>{
    if(el.closest(".no-simp")) return;
    if(el.dataset.tt===undefined) el.dataset.tt=el.title;
    el.title=toSimplified(el.dataset.tt);
  });
}
function restoreTree(root){
  if(!root) return;
  textNodes(root).forEach(n=>{ if(ORIG.has(n)&&n.nodeValue!==ORIG.get(n)) n.nodeValue=ORIG.get(n); });
  root.querySelectorAll("[placeholder]").forEach(el=>{ if(el.dataset.ph!==undefined) el.placeholder=el.dataset.ph; });
  root.querySelectorAll("[title]").forEach(el=>{ if(el.dataset.tt!==undefined) el.title=el.dataset.tt; });
}

}

/* 字數：中文字與英文單字都算 */
function wordCount(p){
  const t=plainText2(p).replace(/\s+/g,"");
  return [...t].length;
}
function plainText2(p){
  const body=p.html||(p.blocks||[]).map(b=>b.html).join(" ");
  return String(body).replace(/<[^>]+>/g," ");
}
function fmtCount(n){ return n>=10000? (n/10000).toFixed(1)+" 萬字" : n>=1000? Math.round(n/100)/10+" 千字" : n+" 字"; }

/* 系列：把同一個系列的章節收成一組 */
function seriesOf(p){ return (p.series||"").trim(); }
function chapterNo(p){ const n=parseFloat(p.chapter); return isNaN(n)?0:n; }
function groupPosts(list){
  const groups=[], byName=new Map();
  list.forEach(p=>{
    const sname=seriesOf(p);
    if(!sname){ groups.push({single:true,post:p,title:p.title,slogan:p.slogan,cover:p.cover,
      tags:p.tags||[],status:p.status||"",words:wordCount(p),created:p.created||0}); return; }
    if(!byName.has(sname)){
      const g={single:false,series:sname,chapters:[],title:sname,cover:"",slogan:"",tags:[],status:"",words:0,created:0};
      byName.set(sname,g); groups.push(g);
    }
    byName.get(sname).chapters.push(p);
  });
  groups.forEach(g=>{
    if(g.single) return;
    g.chapters.sort((a,b)=>chapterNo(a)-chapterNo(b)||(a.created||0)-(b.created||0));
    const first=g.chapters[0];
    g.cover=first.cover; g.slogan=first.slogan||"";
    g.words=g.chapters.reduce((n,c)=>n+wordCount(c),0);
    g.created=Math.max(...g.chapters.map(c=>c.created||0));
    const tags=new Set(); g.chapters.forEach(c=>(c.tags||[]).forEach(t=>tags.add(t)));
    g.tags=[...tags];
    g.status=g.chapters[g.chapters.length-1].status||"";
    g.post=first;
  });
  return groups.sort((a,b)=>b.created-a.created);
}
function chaptersOf(name){
  return POSTS.filter(p=>seriesOf(p)===name).sort((a,b)=>chapterNo(a)-chapterNo(b)||(a.created||0)-(b.created||0));
}
function allTags(){
  const m=new Map();
  POSTS.forEach(p=>(p.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return [...m.keys()].sort();
}

async function loadPosts(){
  const fetchPosts=(async()=>{
    try{
      let signal;
      if(typeof AbortController!=="undefined"){
        const c=new AbortController(); signal=c.signal; setTimeout(()=>c.abort(),2000);
      }
      const r=await fetch("posts.json",{cache:"no-store",signal});
      if(r.ok) return await r.json();
    }catch(e){}
    return null;
  })();
  // 網路卡住時最多等兩秒就放行，不讓畫面一直空著
  const filePromise=Promise.race([fetchPosts,new Promise(res=>setTimeout(()=>res(null),2000))]);
  // 三件事同時做，不要排隊等
  const [filePosts,localPosts,hidden]=await Promise.all([filePromise,getJSON("sese_posts",[]),getJSON("sese_hidden",[])]);
  HIDDEN=hidden;
  const base=Array.isArray(filePosts)?filePosts:SEED_POSTS;
  const map=new Map();
  base.forEach(p=>map.set(p.id,p));
  localPosts.forEach(p=>map.set(p.id,p));
  POSTS=[...map.values()].filter(p=>!HIDDEN.includes(p.id)).sort((a,b)=>(b.created||0)-(a.created||0));
}

/* =========================================================
   6. 音樂：YouTube / bilibili
   ========================================================= */
function parseMedia(raw){
  const u=String(raw||"").trim();
  if(!u) return null;
  const list=(u.match(/[?&]list=([A-Za-z0-9_-]+)/)||[])[1];
  const yt=(u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/)||[])[1]
        || (/^[A-Za-z0-9_-]{11}$/.test(u)? u : "");
  if(/youtube\.com|youtu\.be/i.test(u)||yt){
    if(yt) return {kind:"frame",src:`https://www.youtube.com/embed/${yt}?autoplay=1&playsinline=1&rel=0&loop=1&playlist=${yt}${list?`&list=${list}`:""}`,page:u};
    if(list) return {kind:"frame",src:`https://www.youtube.com/embed/videoseries?list=${list}&autoplay=1&playsinline=1&loop=1`,page:u};
  }
  if(/b23\.tv/i.test(u)) return {kind:"note",src:"",page:u,
    msg:"這是 bilibili 的短網址，請改貼含 BV 開頭編號的完整網址。"};
  const bv=(u.match(/(BV[0-9A-Za-z]{8,12})/)||[])[1];
  const av=(u.match(/\/av(\d+)/i)||[])[1];
  if(bv) return {kind:"frame",src:`https://player.bilibili.com/player.html?bvid=${bv}&autoplay=1&high_quality=1&danmaku=0`,page:u};
  if(av) return {kind:"frame",src:`https://player.bilibili.com/player.html?aid=${av}&autoplay=1&high_quality=1&danmaku=0`,page:u};
  if(/^https?:\/\//i.test(u)) return {kind:"note",src:"",page:u,
    msg:"目前只支援 YouTube 和 bilibili 的影片連結。"};
  return null;
}

let NAV=[], NAV_BACK=false;
function trackNav(h){
  if(NAV_BACK){ NAV_BACK=false; return; }
  if(NAV[NAV.length-1]!==h) NAV.push(h);
  if(NAV.length>60) NAV.shift();
}

/* 不新增歷史紀錄地換頁；replaceState 被擋下時才退回 hash 導覽 */
function goTo(h){
  if((location.hash||"#/")===h){ render(); return; }
  try{
    if(history.replaceState){ NAV_BACK=true; history.replaceState(null,"",h); render(); return; }
  }catch(e){}
  NAV_BACK=true; location.hash=h;
}

function postHTML(p){
  if(p.html) return sanitizeRich(p.html);
  return (p.blocks||[]).map(b=>{
    const c=sanitizeRich(b.html);
    if(b.t==="h") return `<h2>${c}</h2>`;
    if(b.t==="quote") return `<blockquote>${c}</blockquote>`;
    if(b.t==="callout") return `<div class="callout">${c}</div>`;
    if(b.t==="gray") return `<div class="white">${c}</div>`;
    return `<p>${c}</p>`;
  }).join("");
}

/* --- 閱讀進度 --- */
let progT=null, progHandler=null;
function setupProgress(postId){
  const key="sese_pos_"+postId;
  if(progHandler){ window.removeEventListener("scroll",progHandler); progHandler=null; }
  const maxScroll=()=>Math.max(1,document.body.scrollHeight-window.innerHeight);
  store.get(key).then(v=>{
    const r=parseFloat(v||"0");
    if(!(r>0.06&&r<0.92)) return;
    const slot=$("#resumeSlot"); if(!slot) return;
    slot.innerHTML=`<div class="resume"><span class="grow">上次讀到大約 ${Math.round(r*100)}%，要接續嗎？</span>
      <button class="px-btn slim" id="resumeGo">接續閱讀</button>
      <button class="px-btn slim" id="resumeNo">從頭開始</button></div>`;
    $("#resumeGo").onclick=()=>{ window.scrollTo({top:r*maxScroll(),behavior:"smooth"}); slot.innerHTML=""; };
    $("#resumeNo").onclick=()=>{ slot.innerHTML=""; store.set(key,"0"); };
  });
  progHandler=()=>{
    const t=$("#toTop"); if(t) t.classList.toggle("on", window.scrollY>500);
    clearTimeout(progT);
    progT=setTimeout(()=>{ if(location.hash.includes(postId)) store.set(key,String(window.scrollY/maxScroll())); },600);
  };
  window.addEventListener("scroll",progHandler,{passive:true});
}

async function deletePost(id){
  const [local,hidden]=await Promise.all([getJSON("sese_posts",[]),getJSON("sese_hidden",[])]);
  const left=local.filter(p=>p.id!==id);
  if(left.length!==local.length) await setJSON("sese_posts",left);
  if(!hidden.includes(id)){ hidden.push(id); await setJSON("sese_hidden",hidden); }
  await loadPosts();
}

const CMT_CACHE={};
let COMMENTS_API=null;
function setupComments(postId){
  const key="sese_cmt_"+postId;
  const list=$("#cList"), warn=$("#cWarn");

  async function all(){
    if(!CMT_CACHE[key]){ const v=await getJSON(key,[]); if(!CMT_CACHE[key]) CMT_CACHE[key]=v; }
    return CMT_CACHE[key];
  }
  function cached(){ return CMT_CACHE[key]||[]; }
  function save(arr){
    CMT_CACHE[key]=arr;      // 先更新畫面，寫入放到背景
    draw();
    setJSON(key,arr).then(ok=>{
      if(!ok){ warn.textContent="留言顯示出來了，但這次沒能保存，重新整理後可能會消失。"; warn.classList.add("on"); }
    });
    return true;
  }

  function cmtNode(c,arr){
    const mine=c.uid===MY_UID;
    const canEdit=mine;
    const canDel=mine||IS_ADMIN;
    const replies=arr.filter(x=>x.parent===c.id);
    return `<div class="cmt" data-id="${c.id}">
      <div class="avt">${ART.avatar(!!c.admin, String(c.name||"").split("的")[1]||"")}</div>
      <div class="cbody">
        <div><span class="who">${esc(loc(c.name||"匿名"))}</span><span class="when">${fmtTime(c.at)}${c.edited?"・已編輯":""}</span></div>
        <p class="what">${esc(c.text)}</p>
        <div class="cacts">
          ${c.parent?"":`<button data-act="reply" data-id="${c.id}">回覆</button>`}
          ${canEdit?`<button data-act="edit" data-id="${c.id}">編輯</button>`:""}
          ${canDel?`<button data-act="del" data-id="${c.id}">刪除${(!mine&&IS_ADMIN)?"（管理）":""}</button>`:""}
        </div>
        <div class="slot" data-slot="${c.id}"></div>
        ${replies.length?`<div class="replies">${replies.map(r=>cmtNode(r,arr)).join("")}</div>`:""}
      </div></div>`;
  }
  async function draw(){
    const arr=await all();
    const tops=arr.filter(c=>!c.parent);
    list.innerHTML=tops.length? tops.map(c=>cmtNode(c,arr)).join("")
      : `<p class="hint">還沒有留言，來說第一句話吧。</p>`;
    if(LANG==="s") simplifyTree(list);
  }

  list.onclick=e=>{
    const b=e.target.closest("button[data-act]"); if(!b) return;
    const id=b.dataset.id, act=b.dataset.act;
    const arr=cached(); const c=arr.find(x=>x.id===id); if(!c) return;
    const slot=list.querySelector(`[data-slot="${id}"]`);

    if(act==="del"){
      if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="確定刪除？";
        setTimeout(()=>{ if(b.isConnected){b.dataset.armed="0"; draw();} },4000); return; }
      save(arr.filter(x=>x.id!==id&&x.parent!==id)); return;
    }
    if(act==="edit"){
      slot.innerHTML=`<div class="inline-form">
        <textarea rows="3" maxlength="800">${esc(c.text)}</textarea>
        <div class="cmt-warn"></div>
        <div class="row"><button class="px-btn slim" data-ok="1">儲存</button><button class="px-btn slim" data-cancel="1">取消</button></div></div>`;
      if(LANG==="s") simplifyTree(slot);
      const ta=slot.querySelector("textarea"), w=slot.querySelector(".cmt-warn");
      slot.querySelector("[data-cancel]").onclick=()=>slot.innerHTML="";
      slot.querySelector("[data-ok]").onclick=()=>{
        const res=checkComment(ta.value.trim());
        if(!res.ok){ w.textContent=res.why; w.classList.add("on"); return; }
        c.text=ta.value.trim(); c.edited=true; save(arr); toast("已更新留言");
      };
      return;
    }
    if(act==="reply"){
      slot.innerHTML=`<div class="inline-form">
        ${IS_ADMIN?`<input type="text" value="${esc(ADMIN_NAME)}" readonly>`:namePicker("rOO"+c.id,"rXX"+c.id)}
        <textarea rows="2" maxlength="800" placeholder="回覆 ${esc(loc(c.name||"匿名"))}…"></textarea>
        <div class="cmt-warn"></div>
        <div class="row"><button class="px-btn slim" data-ok="1">送出回覆</button><button class="px-btn slim" data-cancel="1">取消</button></div></div>`;
      if(LANG==="s") simplifyTree(slot);
      const ta=slot.querySelector("textarea"), w=slot.querySelector(".cmt-warn");
      const sels=slot.querySelectorAll("select");
      slot.querySelector("[data-cancel]").onclick=()=>slot.innerHTML="";
      slot.querySelector("[data-ok]").onclick=()=>{
        const res=checkComment(ta.value.trim());
        if(!res.ok){ w.textContent=res.why; w.classList.add("on"); return; }
        arr.push({id:uid(),uid:MY_UID,
          name:IS_ADMIN?ADMIN_NAME:`${sels[0].value}的${sels[1].value}`,
          text:ta.value.trim(),at:Date.now(),parent:c.id,admin:IS_ADMIN});
        save(arr); toast("回覆完成");
      };
    }
  };

  COMMENTS_API={draw};
  $("#cSend").onclick=async()=>{
    const text=$("#cText").value.trim();
    const res=checkComment(text);
    if(!res.ok){ warn.textContent=res.why; warn.classList.add("on"); return; }
    warn.classList.remove("on");
    const arr=await all();
    arr.unshift({id:uid(),uid:MY_UID,
      name:IS_ADMIN?ADMIN_NAME:`${$("#cOO").value}的${$("#cXX").value}`,
      text,at:Date.now(),parent:null,admin:IS_ADMIN});
    save(arr);
    $("#cText").value=""; $("#cText").blur();
    try{ if(list.scrollIntoView) list.scrollIntoView({block:"start",behavior:"smooth"}); }catch(e){}
    toast("留言完成，愛心給你 ♡");
  };
  draw();
}

/* --- 編輯器 --- */
function execCmd(cmd,val){
  try{ return document.execCommand ? document.execCommand(cmd,false,val===undefined?null:val) : false; }
  catch(e){ return false; }
}
function topBlockOf(node){
  const ed=$("#editor");
  while(node&&node.parentNode!==ed) node=node.parentNode;
  return (node&&node.parentNode===ed)? node : null;
}
function splitSelection(){
  const ed=$("#editor"), sel=getSelection();
  if(!sel.rangeCount) return null;
  const r=sel.getRangeAt(0);
  const top=topBlockOf(r.commonAncestorContainer);
  if(!top||top.nodeType!==1) return null;
  if(r.collapsed) return top;
  if(!top.contains(r.startContainer)||!top.contains(r.endContainer)) return null;
  const full = (r.toString().trim()===top.textContent.trim());
  if(full) return top;
  const post=document.createElement("p"), pre=document.createElement("p"), mid=document.createElement("p");
  const rA=document.createRange(); rA.setStart(r.endContainer,r.endOffset); rA.setEnd(top,top.childNodes.length);
  post.appendChild(rA.extractContents());
  const rB=document.createRange(); rB.setStart(top,0); rB.setEnd(r.startContainer,r.startOffset);
  pre.appendChild(rB.extractContents());
  mid.innerHTML=top.innerHTML||"<br>";
  if(pre.textContent.trim()||pre.querySelector("img")) top.before(pre);
  top.after(post);
  if(!post.textContent.trim()) post.remove();
  top.replaceWith(mid);
  return mid;
}
function applyBlock(kind){
  const ed=$("#editor");
  let target=splitSelection();          // 先讀選取範圍：focus() 會清掉尚未聚焦時的選取
  if(!target){ ed.focus(); target=splitSelection()||ed.lastElementChild; }
  if(!target) return;
  const isBox=(kind==="callout"||kind==="white");
  const cur=target.tagName.toLowerCase();
  const curBox=target.classList&&(target.classList.contains("callout")?"callout":target.classList.contains("white")?"white":"");
  let el;
  if(isBox){
    if(curBox===kind){ el=document.createElement("p"); el.innerHTML=target.innerHTML.replace(/<\/?p[^>]*>/g,""); }
    else { el=document.createElement("div"); el.className=kind;
      el.innerHTML=/^<p/i.test(target.innerHTML.trim())? target.innerHTML : `<p>${target.innerHTML||"<br>"}</p>`; }
  }else{
    if(cur===kind&&!curBox){ el=document.createElement("p"); el.innerHTML=target.innerHTML; }
    else { el=document.createElement(kind); el.innerHTML=curBox? target.textContent : (target.innerHTML||"<br>"); }
  }
  target.replaceWith(el);
  const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  scheduleDraft();
}
function textToNodes(text){
  const f=document.createDocumentFragment();
  String(text).replace(/\r\n?/g,"\n").split("\n").forEach(line=>{
    const p=document.createElement("p");
    if(line.trim()==="") p.innerHTML="<br>"; else p.textContent=line;
    f.appendChild(p);
  });
  return f;
}
function wireEditor(){
  const ed=$("#editor");
  ed.addEventListener("paste",e=>{
    e.preventDefault();
    const html=e.clipboardData.getData("text/html");
    const text=e.clipboardData.getData("text/plain");
    let frag;
    if(html&&/<(p|div|br|h[1-6]|li)\b/i.test(html)){
      const box=document.createElement("div"); box.innerHTML=sanitizeRich(html);
      frag=document.createDocumentFragment(); while(box.firstChild) frag.appendChild(box.firstChild);
    }else frag=textToNodes(text);
    const sel=getSelection(); if(!sel.rangeCount) return;
    const r=sel.getRangeAt(0); r.deleteContents();
    const last=frag.lastChild; r.insertNode(frag);
    if(last){ const nr=document.createRange(); nr.selectNodeContents(last); nr.collapse(false);
      sel.removeAllRanges(); sel.addRange(nr); }
    scheduleDraft();
  });
  ed.addEventListener("input",scheduleDraft);
  document.querySelectorAll(".toolbar [data-cmd]").forEach(b=>{
    b.onmousedown=e=>e.preventDefault();
    b.onclick=()=>{ ed.focus(); execCmd(b.dataset.cmd); scheduleDraft(); };
  });
  document.querySelectorAll(".toolbar [data-blk]").forEach(b=>{
    b.onmousedown=e=>e.preventDefault();
    b.onclick=()=>applyBlock(b.dataset.blk);
  });
  $("#clearFmt").onmousedown=e=>e.preventDefault();
  $("#clearFmt").onclick=()=>{ ed.focus(); execCmd("removeFormat"); applyBlock("p"); };
}

/* --- 草稿 --- */
let draftT;
function currentDraft(){
  return { title:$("#fTitle").value, slogan:$("#fSlogan").value, cover:$("#cvPrev").dataset.src||"",
    media:$("#fMedia").value, html:$("#editor").innerHTML,
    series:$("#fSeries").value, chapter:$("#fChapter").value,
    status:$("#fStatus").value, tags:$("#fTags").value, at:Date.now() };
}
function scheduleDraft(){ clearTimeout(draftT); draftT=setTimeout(saveDraft,900); }
async function saveDraft(){
  if(!$("#fTitle")||!$("#editor")) return;   // 已離開管理頁
  const d=currentDraft();
  if(!d.title&&!d.slogan&&!d.media&&!d.series&&!d.chapter&&!d.tags&&!d.cover&&$("#editor").textContent.trim()==="") return;
  const ok=await setJSON("sese_draft",d);
  const m=$("#draftMsg"); if(m) m.textContent=ok? "草稿已保存 "+fmtTime(d.at) : "草稿太大，存不下（圖片請縮小）";
}
function applyDraft(d){
  $("#fTitle").value=d.title||""; $("#fSlogan").value=d.slogan||""; $("#fMedia").value=d.media||"";
  $("#fSeries").value=d.series||""; $("#fChapter").value=d.chapter||"";
  $("#fStatus").value=d.status||""; $("#fTags").value=d.tags||"";
  if(d.cover){ $("#cvPrev").innerHTML=`<img src="${d.cover}" alt="">`; $("#cvPrev").dataset.src=d.cover; }
  if(d.html) $("#editor").innerHTML=d.html;
}

/* --- 圖片壓縮（含 iPhone HEIC 轉檔） --- */
function readFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }

/* heic2any（MIT, Alex Corvi）只在遇到 HEIC 時才載入：先找同資料夾的檔案，找不到再走 CDN */
let heicLoading=null;
function loadHeicLib(){
  if(window.heic2any) return Promise.resolve(true);
  if(heicLoading) return heicLoading;
  heicLoading=new Promise(res=>{
    const attempt=(src,next)=>{
      const s=document.createElement("script"); s.src=src;
      s.onload=()=>res(!!window.heic2any); s.onerror=next;
      document.head.appendChild(s);
    };
    attempt("heic2any.min.js",()=>
      attempt("https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js",()=>res(false)));
  });
  return heicLoading;
}
function looksHeic(f){ return /heic|heif/i.test(f.type)||/\.(heic|heif)$/i.test(f.name); }
async function toJpegFile(file){
  const ok=await loadHeicLib();
  if(!ok) throw new Error("HEIC_LIB_MISSING");
  const out=await window.heic2any({blob:file,toType:"image/jpeg",quality:0.9});
  const blob=Array.isArray(out)?out[0]:out;
  return new File([blob],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"});
}
async function compressImage(file){
  let f=file;
  if(looksHeic(f)) f=await toJpegFile(f);
  let raw,img;
  try{
    raw=await readFile(f); img=await loadImg(raw);
  }catch(e){
    if(f===file){ f=await toJpegFile(file); raw=await readFile(f); img=await loadImg(raw); }  // 副檔名沒寫但其實是 HEIC
    else throw e;
  }
  const maxW=1920;
  if(img.width<=maxW&&f.size<500*1024) return {src:raw,w:img.width,h:img.height,bytes:f.size};
  const scale=Math.min(1,maxW/img.width);
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  let q=0.85, out=c.toDataURL("image/jpeg",q);
  while(out.length>1_400_000&&q>0.5){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
  return {src:out,w:c.width,h:c.height,bytes:Math.round(out.length*0.75)};
}

/* --- 其他管理動作 --- */
function wireAdmin(){
  const prev=$("#cvPrev");
  function setCover(src){ prev.innerHTML=`<img src="${src}" alt="">`; prev.dataset.src=src; scheduleDraft(); }
  $("#cvFile").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const info=$("#cvInfo");
    if(f.size>MAX_IMAGE_MB*1024*1024) return toast(`圖片超過 ${MAX_IMAGE_MB}MB，請先縮小`);
    info.textContent = looksHeic(f)
      ? `iPhone 的 HEIC 照片，轉檔中…（第一次會多花幾秒）`
      : `讀取中… ${f.name}（${(f.size/1024).toFixed(0)}KB・${f.type||"未知格式"}）`;
    try{
      const r=await compressImage(f);
      setCover(r.src);
      const ratio=r.w/r.h;
      info.textContent=`已載入 ${r.w}×${r.h}，約 ${(r.bytes/1024).toFixed(0)}KB`
        +(looksHeic(f)?"（HEIC 已轉成 JPG）":"")
        +(Math.abs(ratio-16/9)>0.06?"（不是 16:9，會置中裁切）":"");
    }catch(err){
      info.textContent = String(err&&err.message)==="HEIC_LIB_MISSING"
        ? "HEIC 轉檔工具載入失敗。請確認 heic2any.min.js 和 index.html 放在同一層，或先讓裝置連上網路再試。"
        : `這張圖片讀不進來（${f.type||"未知格式"}），換一張 JPG 或 PNG 試試。`;
    }
  };
  $("#cvUrl").oninput=e=>{ if(e.target.value.trim()) setCover(e.target.value.trim()); };
  $("#cvDel").onclick=()=>{
    prev.innerHTML=""; delete prev.dataset.src;
    $("#cvUrl").value=""; $("#cvFile").value=""; $("#cvInfo").textContent="已移除封面圖，發佈時會用預設的像素底圖。";
    scheduleDraft();
  };
  ["#fTitle","#fSlogan","#fMedia","#fSeries","#fChapter","#fTags"].forEach(id=>$(id).oninput=scheduleDraft);
  $("#fStatus").onchange=scheduleDraft;
  $("#draftSave").onclick=saveDraft;
  $("#draftClear").onclick=async()=>{ await setJSON("sese_draft",null); $("#draftMsg").textContent="草稿已清除"; };
  $("#outBtn").onclick=async()=>{ IS_ADMIN=false; await store.set("sese_admin","0"); location.hash="#/"; toast("已登出"); };

  $("#prevBtn").onclick=()=>{
    const html=sanitizeRich($("#editor").innerHTML);
    $("#modalIn").innerHTML=`
      <div class="modal-bar"><b>預覽（讀者看到的樣子）</b><button class="px-btn slim" id="mClose">關閉</button></div>
      <div class="modal-cover"><img src="${esc($("#cvPrev").dataset.src||pixelCover(4))}" alt=""></div>
      <div class="modal-body">
        <div class="post-head"><h1>${esc($("#fTitle").value||"（還沒有標題）")}</h1>
          <p class="slogan">${esc($("#fSlogan").value||"")}</p></div>
        <div class="rich" style="margin-top:26px">${html}</div>
      </div>`;
    $("#modal").classList.add("on");
    $("#mClose").onclick=()=>$("#modal").classList.remove("on");
  };
  $("#modal").onclick=e=>{ if(e.target.id==="modal") $("#modal").classList.remove("on"); };

  $("#saveBtn").onclick=async()=>{
    const title=$("#fTitle").value.trim();
    if(!title) return toast("還沒有填標題");
    const html=sanitizeRich($("#editor").innerHTML);
    if(!$("#editor").textContent.trim()) return toast("內文是空的");
    const post={ id:"p"+Date.now(), title, slogan:$("#fSlogan").value.trim(),
      cover:$("#cvPrev").dataset.src||pixelCover(Math.floor(Math.random()*9)),
      media:{value:$("#fMedia").value.trim()}, html, created:Date.now(),
      series:$("#fSeries").value.trim(), chapter:$("#fChapter").value.trim(),
      status:$("#fStatus").value,
      tags:$("#fTags").value.split(/[,，、\s]+/).map(t=>t.trim()).filter(Boolean) };
    const list=await getJSON("sese_posts",[]); list.push(post);
    await setJSON("sese_posts",list);
    const back=await getJSON("sese_posts",[]);      // 寫入後再讀回來確認
    if(!back.some(p=>p.id===post.id)){
      toast(store.mode==="none"
        ? "這個瀏覽器不允許儲存（可能是無痕模式），文章存不下來。換一般視窗再試一次。"
        : "儲存空間不足，這篇沒存成功。把封面圖換小一點，或改用圖片網址再試一次。");
      return;
    }
    clearTimeout(draftT);
    await setJSON("sese_draft",null);
    await loadPosts(); toast("已發佈"); location.hash="#/post/"+encodeURIComponent(post.id);
  };

  $("#expBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(POSTS,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="posts.json"; a.click();
    URL.revokeObjectURL(a.href); toast("posts.json 已下載");
  };
}

/* =========================================================
   12. 啟動
   ========================================================= */
(async()=>{
  if("scrollRestoration" in history) history.scrollRestoration="manual";
  render();                                   // 立刻畫出版面，不等儲存與網路
  await store.init();
  const [u,adm,lang,theme,read]=await Promise.all([   // 五個設定一次讀完，不要一個等一個
    store.get("sese_uid"),store.get("sese_admin"),store.get("sese_lang"),
    store.get("sese_theme"),store.get("sese_read")]);
  MY_UID=u; if(!MY_UID){ MY_UID=uid(); store.set("sese_uid",MY_UID); }
  IS_ADMIN=adm==="1";
  LANG=lang==="s"?"s":"t";
  THEME=theme||"auto"; applyTheme();
  READ=read||"m"; document.body.dataset.read=READ;
  await loadPosts();
  BOOTING=false;
  render();
})();
</script>
